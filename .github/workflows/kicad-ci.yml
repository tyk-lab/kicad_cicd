# KiCad项目自动化构建工作流（简化版 - 使用Python脚本）
# 功能：ERC/DRC检查、导出原理图PDF、BOM、Gerber文件和PCB图像
name: KiCad CI/CD

# 触发条件：智能触发策略
on:
  # 推送到主分支（只监控 KiCad 相关文件变更）
  push:
    branches:
      - main
      - master
    paths:
      - '**.kicad_pro'
      - '**.kicad_sch'
      - '**.kicad_pcb'
      - 'scripts/**'
      - '.github/workflows/kicad-ci.yml'
  
  # Pull Request：只运行检查，不发布
  pull_request:
    branches:
      - main
      - master
    paths:
      - '**.kicad_pro'
      - '**.kicad_sch'
      - '**.kicad_pcb'
      - 'scripts/**'
  
  # 手动触发：完整控制
  workflow_dispatch:
    inputs:
      skip_checks:
        description: '跳过 ERC/DRC 检查'
        required: false
        type: boolean
        default: false
      skip_exports:
        description: '跳过文件导出'
        required: false
        type: boolean
        default: false
      create_release:
        description: '创建 Release'
        required: false
        type: boolean
        default: true

# 设置GitHub Token权限
permissions:
  contents: write

# 全局环境变量配置
env:
  KICAD_PROJECT_NAME: "229_Test"  # KiCad项目名称（不含扩展名）
  OUTPUT_DIR: "outputs"            # 输出目录

jobs:
  kicad-build:
    runs-on: ubuntu-22.04
    
    steps:
      # 步骤1：检出代码仓库
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # 步骤2：缓存KiCad安装标记
      - name: Cache KiCad installation marker
        id: cache-kicad
        uses: actions/cache@v4
        with:
          path: ~/.kicad-installed
          key: kicad-snap-${{ runner.os }}-${{ hashFiles('.github/workflows/kicad-ci.yml') }}
      
      # 步骤3：检查KiCad是否已安装
      - name: Check KiCad installation
        id: check-kicad
        run: |
          if command -v kicad.kicad-cli &> /dev/null && [ -f ~/.kicad-installed ]; then
            echo "✓ KiCad已安装 (snap版本)"
            kicad.kicad-cli version
            echo "cached=true" >> $GITHUB_OUTPUT
          elif command -v kicad-cli &> /dev/null && [ -f ~/.kicad-installed ]; then
            echo "✓ KiCad已安装"
            kicad-cli version
            echo "cached=true" >> $GITHUB_OUTPUT
          else
            echo "✗ 需要安装KiCad"
            echo "cached=false" >> $GITHUB_OUTPUT
          fi
      
      # 步骤4：安装KiCad（仅在未安装时）
      - name: Install KiCad
        if: steps.check-kicad.outputs.cached == 'false'
        run: |
          echo "安装KiCad via snap..."
          sudo snap install kicad
          
          # 检测安装的命令
          if command -v kicad.kicad-cli &> /dev/null; then
            echo "✓ 安装成功: kicad.kicad-cli"
            kicad.kicad-cli version
            sudo ln -sf /snap/bin/kicad.kicad-cli /usr/bin/kicad-cli
          elif [ -f "/snap/bin/kicad-cli" ]; then
            echo "✓ 安装成功: kicad-cli"
            /snap/bin/kicad-cli version
            sudo ln -sf /snap/bin/kicad-cli /usr/bin/kicad-cli
          else
            echo "⚠ Snap CLI不可用，尝试APT安装..."
            sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
            sudo apt-get update
            sudo apt-get install -y kicad
            
            if ! command -v kicad-cli &> /dev/null; then
              echo "✗ KiCad安装失败"
              exit 1
            fi
            kicad-cli version
          fi
          
          touch ~/.kicad-installed
          echo "✓ KiCad安装完成"
      
      # 步骤5：运行Python自动化导出脚本
      - name: Run KiCad Export Script
        id: kicad-export
        continue-on-error: true
        run: |
          # 确保脚本可执行
          chmod +x scripts/kicad_export.py
          
          # 构建参数
          SKIP_CHECKS=""
          SKIP_EXPORTS=""
          
          # PR 模式：只检查，不导出
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SKIP_EXPORTS="--skip-exports"
            echo "📋 PR 模式：只运行质量检查"
          fi
          
          # 手动触发：根据输入决定
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.skip_checks }}" = "true" ]; then
              SKIP_CHECKS="--skip-checks"
            fi
            if [ "${{ github.event.inputs.skip_exports }}" = "true" ]; then
              SKIP_EXPORTS="--skip-exports"
            fi
          fi
          
          # 运行导出脚本
          python3 scripts/kicad_export.py ${{ env.KICAD_PROJECT_NAME }}.kicad_pro -o ${{ env.OUTPUT_DIR }} $SKIP_CHECKS $SKIP_EXPORTS
          
          exit_code=$?
          
          # 读取结果供后续步骤使用
          if [ -f "${{ env.OUTPUT_DIR }}/erc_report.json" ]; then
            violations=$(python3 -c "import json; data=json.load(open('${{ env.OUTPUT_DIR }}/erc_report.json')); print(len(data.get('violations', [])))" 2>/dev/null || echo "unknown")
            echo "erc_violations=$violations" >> $GITHUB_OUTPUT
            [ "$violations" = "0" ] && echo "erc_status=passed" >> $GITHUB_OUTPUT || echo "erc_status=failed" >> $GITHUB_OUTPUT
          else
            echo "erc_status=skipped" >> $GITHUB_OUTPUT
          fi
          
          if [ -f "${{ env.OUTPUT_DIR }}/drc_report.json" ]; then
            violations=$(python3 -c "import json; data=json.load(open('${{ env.OUTPUT_DIR }}/drc_report.json')); print(len(data.get('violations', [])))" 2>/dev/null || echo "unknown")
            echo "drc_violations=$violations" >> $GITHUB_OUTPUT
            [ "$violations" = "0" ] && echo "drc_status=passed" >> $GITHUB_OUTPUT || echo "drc_status=failed" >> $GITHUB_OUTPUT
          else
            echo "drc_status=skipped" >> $GITHUB_OUTPUT
          fi
          
          exit $exit_code
      
      # 步骤6：上传构建产物到GitHub Artifacts
      - name: Upload artifacts
        if: always()  # 即使检查失败也上传报告
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KICAD_PROJECT_NAME }}-outputs-${{ github.run_number }}
          path: ${{ env.OUTPUT_DIR }}/
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}  # PR保留7天，主分支30天
      
      # 步骤7：更新README构建状态（仅主分支推送时）
      - name: Update README with build status
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          # 运行README更新脚本
          python3 scripts/update_readme.py \
            -o ${{ env.OUTPUT_DIR }} \
            -r README.md \
            -b ${{ github.run_number }}
          
          # 检查是否有变化
          if git diff --quiet README.md; then
            echo "README 无变化"
          else
            echo "README 已更新"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: 更新构建状态 #${{ github.run_number }} [skip ci]"
            git push
          fi
      
      # 步骤8：准备Release文件（仅主分支推送或手动创建时）
      - name: Prepare release files
        if: |
          (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        run: |
          mkdir -p release
          
          # 复制关键输出文件
          for file in ${{ env.OUTPUT_DIR }}/${{ env.KICAD_PROJECT_NAME }}-Schematic.pdf \
                      ${{ env.OUTPUT_DIR }}/${{ env.KICAD_PROJECT_NAME }}-BOM.csv \
                      ${{ env.OUTPUT_DIR }}/${{ env.KICAD_PROJECT_NAME }}-Gerber.zip \
                      ${{ env.OUTPUT_DIR }}/${{ env.KICAD_PROJECT_NAME }}-PCB-Front.svg \
                      ${{ env.OUTPUT_DIR }}/${{ env.KICAD_PROJECT_NAME }}-PCB-Back.svg \
                      ${{ env.OUTPUT_DIR }}/${{ env.KICAD_PROJECT_NAME }}-3D.step; do
            [ -f "$file" ] && cp "$file" release/ && echo "✓ $(basename $file)"
          done
          
          # 复制报告和摘要
          [ -f "${{ env.OUTPUT_DIR }}/erc_report.json" ] && cp ${{ env.OUTPUT_DIR }}/erc_report.json release/
          [ -f "${{ env.OUTPUT_DIR }}/drc_report.json" ] && cp ${{ env.OUTPUT_DIR }}/drc_report.json release/
          [ -f "${{ env.OUTPUT_DIR }}/build_summary.md" ] && cp ${{ env.OUTPUT_DIR }}/build_summary.md release/
          
          echo "Release包大小: $(du -sh release | cut -f1)"
      
      # 步骤9：创建GitHub Release（可选）
      - name: Create Release
        if: |
          (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.KICAD_PROJECT_NAME }}-build-${{ github.run_number }}
          name: ${{ env.KICAD_PROJECT_NAME }} Build ${{ github.run_number }}
          body_path: ${{ env.OUTPUT_DIR }}/build_summary.md
          files: release/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
   